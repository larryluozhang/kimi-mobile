name: KimiMobile
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
packages:
  # sherpa-onnx 离线语音识别（SwiftPM，Apache-2.0）；产品名与包名同为 sherpa-onnx
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    from: 1.13.7
  # zip 解压（离线语音模型按需下载后解压到 Application Support）
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "XXXXXXXXXX"
    GENERATE_INFOPLIST_FILE: NO
targets:
  KimiMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KimiMobile/Sources
      - path: KimiMobile/Assets.xcassets
      # 离线语音识别模型不再打进 bundle：0.6.1 起改按需下载到 Application Support（设置页入口）
    dependencies:
      - package: sherpa-onnx
        product: sherpa-onnx
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kimimobile
        INFOPLIST_FILE: KimiMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.6.2"
        CURRENT_PROJECT_VERSION: "5"
        ENABLE_PREVIEWS: YES
