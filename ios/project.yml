name: KimiMobile
options:
  bundleIdPrefix: com.kimimobile
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "XXXXXXXXXX"
    GENERATE_INFOPLIST_FILE: NO
targets:
  KimiMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KimiMobile/Sources
      - path: KimiMobile/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimimobile.app
        INFOPLIST_FILE: KimiMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.7.4"
        CURRENT_PROJECT_VERSION: 11
        ENABLE_PREVIEWS: YES
